name: CI

# Pull requests only.
#
# This used to run on every push to every branch as well, which did the same
# work twice in the two places it mattered:
#
#  - A push to a branch with an open pull request fired both triggers. They land
#    in different concurrency groups (refs/heads/x and refs/pull/N/merge), so
#    neither cancelled the other and every push ran the suite twice.
#  - A merge to main ran the suite here and again in deploy.yml, which verifies
#    the commit itself before it ships. That one is the gate on main.
#
# The cost: a branch gets no CI until it has a pull request. Open a draft, or
# start a run by hand from the Actions tab.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same pull request; the latest push is the one
# that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches .nvmrc and the SWA managed Functions runtime.
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Runs the same five gates as `npm run verify` locally, but as separate
      # steps so a failure names itself in the job summary instead of hiding in
      # a wall of output.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Starts Azurite itself; no service container needed.
      - name: Integration tests (Azurite)
        run: npm run test:integration

      - name: Build web bundle
        run: npm run bundle --workspace web
